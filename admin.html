<!doctype html><html lang="en-NZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ETI community event review."><title>Administration | Enterprising Taumarunui</title><link rel="stylesheet" href="style.css"></head><body><header><nav><a class="logo" href="index.html">ET<span>I</span><small style="display:block;font-size:9px;letter-spacing:.13em;font-weight:500">ENTERPRISING TAUMARUNUI</small></a><button class="site-nav-toggle" type="button" aria-expanded="false" aria-controls="site-links">Menu ☰</button><div class="links" id="site-links"><a href="index.html">Home</a><a href="about.html">About</a><a href="directory.html">Directory</a><a href="membership.html">Membership</a><a href="networking.html">Networking</a><a href="events.html">What’s On</a><a href="contact.html">Contact</a></div></nav></header><main><section class="hero"><div class="wrap"><p class="eyebrow">ETI administration</p><h1>Event review</h1><p>Review community submissions before they appear on the calendar.</p></div></section>
<section class="section"><div class="wrap"><form class="form" id="access"><label>Reviewer key<input type="password" name="key" autocomplete="current-password" required></label><button>Open review queue</button></form>
<div id="controls" hidden><button type="button" id="refresh">Refresh queue</button> <button type="button" id="logout">Lock queue</button></div><p id="review-status" role="status"></p><div id="queue"></div></div></section>
<template id="review"><form class="form"><h2></h2><p class="contact"></p>
<label>Event name<input name="title" required maxlength="140"></label>
<label>Venue or meeting point<input name="location" required maxlength="240"></label>
<label>Starts (NZ time)<input type="datetime-local" name="start" required></label>
<label>Ends (NZ time)<input type="datetime-local" name="end" required></label>
<label>Public event details<textarea name="description" rows="5" required maxlength="2000"></textarea></label><button value="approve">Approve and publish</button> <button value="decline" formnovalidate>Decline</button><p role="status"></p></form></template></main><footer><div class="wrap"><strong>Enterprising Taumarunui</strong><p>Local connections. Bigger possibilities.</p><a href="privacy.html">Privacy</a><a href="contact.html">Contact</a></div></footer><script src="site.js" defer></script><script type="module" src="community.js"></script></body></html>
